<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocket Arena</title><meta name="description" content="Car football fan project: garage, bots and LAN multiplayer."><link rel="stylesheet" href="app.css?v=stadium-finale-20261027"><link rel="stylesheet" href="inventory.css?v=inventory-20261028"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><canvas id="game" aria-label="Arena de fútbol con carros"></canvas><main id="front"></main>
<div id="hud" hidden><header><div class="brand">◈ ROCKET ARENA</div><div class="scoreboard"><div><span id="blue">0</span><b id="match-clock">5:00</b><span id="orange">0</span></div><small id="match-type">CASUAL</small></div></header><footer><div class="control-help"><b>WASD</b> Conducir / orientar <b>RMB / J</b> Saltar <b>LMB / K</b> Boost<br><b>SHIFT</b> Derrape / air roll <b>ESPACIO</b> Cámara <b>ESC</b> Menú</div><div class="telemetry"><div><strong id="speed">0</strong><small>KM/H</small></div><div class="fuel"><strong id="boost">33</strong><small>BOOST</small><div id="boost-track" class="track" role="progressbar" aria-label="Boost restante" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33"><i id="boostbar"></i></div></div></div></footer></div>
<div id="goal" hidden>3</div><section id="replay" hidden aria-label="Repetición del gol"><div><b>● REPLAY</b><button id="skip-replay">Saltar repetición <kbd>ENTER</kbd></button></div><div class="replay-track"><i id="replay-progress"></i></div></section>
<div id="toast" role="status" hidden></div>
<div id="save-award" role="status" hidden><span>◈</span><strong id="save-title">¡SALVADA!</strong><small>PORTERÍA PROTEGIDA</small></div>
<div id="join-modal" class="modal-shade" hidden><form id="join-form" class="dialog panel"><span class="eyebrow">UNIRSE A SALA</span><h2 id="join-title">Sala</h2><label>CONTRASEÑA<input id="join-password" type="password" maxlength="64" autocomplete="off" required></label><button class="primary" type="submit">SOLICITAR ACCESO</button><button id="join-cancel" type="button">CANCELAR</button></form></div>
<div id="admission" class="modal-shade" hidden><section class="dialog panel" role="dialog" aria-label="Elegir equipo del jugador"><span class="eyebrow">SOLICITUD DE ENTRADA</span><h2 id="admission-name">Jugador</h2><p>Elige qué bot reemplazará esta persona.</p><div class="field-pair"><button id="admit-0" class="team-blue">EQUIPO AZUL</button><button id="admit-1" class="team-orange">EQUIPO NARANJA</button></div><button id="admit--1">RECHAZAR</button></section></div>
<section id="match-scoreboard" hidden aria-label="Puntuación del partido"></section>
<script type="module" src="game.js?v=coherent-bots-20261101"></script></body></html>
